<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patchbay</title>
<script>
(function () {
  var t = 'ko';
  try {
    var stored = localStorage.getItem('hc1-theme');
    if (stored === 'ko' || stored === 'riddim') t = stored;
  } catch (e) { /* localStorage unavailable */ }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1C1C1C">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="wrap" id="app">

  <div class="chiprow">
    <button class="chip" id="chip-settings" type="button" title="Open settings">SETTINGS</button>
    <span class="chip on" id="chip-down" hidden>0 DOWN</span>
    <button class="chip" id="chip-check" type="button" title="Check uptime for every visible service (two samples, averaged). Private services are checked through your Pangolin connection — if it's disconnected, they can read UP even when unreachable.">CHECK</button>
    <button class="chip" id="chip-search" type="button">SEARCH</button>
    <button class="chip" id="chip-edit" type="button">EDIT</button>
    <button class="chip dk" id="chip-theme" type="button">THEME · KO</button>
  </div>

  <div id="notice" class="notice" hidden></div>

  <div class="plate">
    <div class="plate-id">
    <svg class="plate-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" class="pm-bg"/><g class="pm-jack"><circle cx="15" cy="22" r="6.2"/><circle cx="32" cy="22" r="6.2"/><circle cx="49" cy="22" r="6.2"/><circle cx="15" cy="44" r="6.2"/><circle cx="32" cy="44" r="6.2"/><circle cx="49" cy="44" r="6.2"/></g><g class="pm-hole"><circle cx="15" cy="22" r="2.6"/><circle cx="32" cy="22" r="2.6"/><circle cx="49" cy="22" r="2.6"/><circle cx="15" cy="44" r="2.6"/><circle cx="32" cy="44" r="2.6"/><circle cx="49" cy="44" r="2.6"/></g><path class="pm-cable" d="M15 22 C15 40 49 26 49 44"/><g class="pm-plug"><circle cx="15" cy="22" r="4"/><circle cx="49" cy="44" r="4"/></g></svg>
    <div>
      <div class="plate-model" id="plate-model">HC&#8209;1</div>
      <div class="plate-sub" id="plate-sub">&#12469;&#12540;&#12496;&#12540;</div>
    </div>
    </div>
    <div class="plate-desc" id="plate-desc">00 SERVICE PANEL</div>
  </div>

  <div class="scr">
    <div class="scr-top">
      <div class="scr-big" id="scr-big">00<small>/ 00 UP</small></div>
      <div class="scr-glyphs" id="scr-glyphs"></div>
    </div>
    <div class="scr-meta" id="scr-meta"></div>
    <div id="scr-sys" class="scr-sys" hidden></div>
  </div>

  <section class="tray" id="tray" hidden>
    <div class="section-head">
      <span class="lbl">NEW FROM PANGOLIN</span>
      <button class="section-btn" id="tray-place-all" type="button" hidden>PLACE ALL SUGGESTED</button>
    </div>
    <div class="pad" id="tray-items"></div>
  </section>

  <section class="groups" id="groups"></section>

  <div class="edit-actions" id="edit-actions" hidden>
    <button id="add-group-btn" class="btn" type="button">+ ADD GROUP</button>
    <button id="add-widget-btn" class="btn" type="button">+ ADD WIDGET</button>
    <button id="add-link-btn" class="btn btn-primary" type="button">+ ADD LINK</button>
  </div>
</div>

<div class="search-overlay" id="search-overlay" hidden>
  <div class="search-box">
    <input id="search-input" type="text" placeholder="Search services&hellip;" autocomplete="off" spellcheck="false">
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<div class="modal-scrim" id="modal-scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-title">ADD LINK</span>
      <button class="modal-close" id="modal-close" type="button" aria-label="Close">&times;</button>
    </div>

    <div class="modal-error" id="modal-error" hidden></div>

    <form class="modal-form" id="form-manual">
      <label>NAME<input type="text" name="name" required></label>
      <label>URL<input type="url" name="url" required placeholder="https://example.com"></label>
      <label>GROUP<select name="groupId" required></select></label>
      <button type="submit" class="btn btn-primary">ADD LINK</button>
    </form>
  </div>
</div>

<div class="modal-scrim" id="widget-modal-scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-title">ADD WIDGET</span>
      <button class="modal-close" id="widget-modal-close" type="button" aria-label="Close">&times;</button>
    </div>

    <div class="modal-error" id="widget-modal-error" hidden></div>

    <form class="modal-form" id="form-widget">
      <label>WIDGET<select name="widget" id="widget-type-select"></select></label>
      <label>GROUP<select name="groupId" required></select></label>
      <button type="submit" class="btn btn-primary">ADD WIDGET</button>
    </form>
  </div>
</div>

<script src="/vendor/embla-carousel.umd.js"></script>
<script src="/app.js"></script>
</body>
</html>
